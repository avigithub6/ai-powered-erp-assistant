
server:
  port: 8080

spring:
  application:
    name: spring-boot-erp

  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SPRING_DB_USER}
    password: ${SPRING_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  jackson:
    default-property-inclusion: non_null

app:
  internal:
    token: ${SPRING_BOOT_INTERNAL_TOKEN}
