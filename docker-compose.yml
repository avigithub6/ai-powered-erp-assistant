
services:
  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  spring-boot-erp:
    build:
      context: ./spring-boot-erp
      dockerfile: Dockerfile
    container_name: erp-spring-boot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      SPRING_DB_USER: ${SPRING_DB_USER}
      SPRING_DB_PASSWORD: ${SPRING_DB_PASSWORD}
      SPRING_BOOT_INTERNAL_TOKEN: ${SPRING_BOOT_INTERNAL_TOKEN}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD_URLENCODED}@mysql:3306/${MYSQL_DATABASE}"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SPRING_BOOT_ERP_BASE_URL: http://spring-boot-erp:8080
      SPRING_BOOT_INTERNAL_TOKEN: ${SPRING_BOOT_INTERNAL_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      spring-boot-erp:
        condition: service_started

volumes:
  mysql_data:
